version: '3'


tasks:
  default:
    desc: Start dev server
    deps:
      - install
    cmds:
      - pnpm run dev
  install:
    cmds:
      - pnpm i --ignore-scripts --no-frozen-lockfile
  build:
    deps:
      - install
    cmds:
      - pnpm run build
  start:
    cmds:
      - pnpm run start
