name: Python Setup
description: Install Python
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Set up Python
      shell: bash
      run: uv python install
    - name: Sync
      shell: bash
      run: uv sync --locked --all-extras --dev
