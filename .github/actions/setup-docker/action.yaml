name: Docker Setup
description: Setup docker daemon
runs:
  using: "composite"
  steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
      with:
        version: type=archive,channel=stable,version=v28.5.2
        daemon-config: |
          {
            "registry-mirrors": [
              "https://mirror.gcr.io"
            ]
          }
