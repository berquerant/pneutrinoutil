name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-binaries:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Build
        run: ./task build:binaries

  build-images:
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup Buildx
        run: |
          docker buildx version
          docker buildx create --name mybuilder --use
          docker buildx inspect --bootstrap
      - name: Build
        run: ./task build:images

  test:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Go modules and build folders
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ./tmp/lima/go
          key: ${{ runner.os }}-lima-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-lima-go-
      - name: Cache Images
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ./tmp/lima/docker
          key: ${{ runner.os }}-lima-docker
      - name: Setup Lima
        uses: ./.github/actions/setup-lima
      - name: Start VM
        run: ./bin/lima.sh start
        env:
          TARGET_REF: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - name: Run Unit Test
        run: ./bin/lima.sh run ./task test:unit
      - name: Set SKIP_BUILD=true
        run: ./bin/lima.sh run 'echo "export SKIP_BUILD=true" >> .envrc'
      - name: Set SKIP_RELOAD_CLUSTER=true
        run: ./bin/lima.sh run 'echo "export SKIP_RELOAD_CLUSTER=true" >> .envrc'
      - name: Run E2E Test
        run: ./bin/lima.sh run ./task test:e2e

