  lint:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set env vars
        uses: ./.github/actions/setup-env
      - name: Setup Go
        uses: ./.github/actions/setup-go
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Lint
        run: ./task lint

  govulncheck:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: berquerant/govulncheck-action@7c7f559180aca72a1badcead05a3d5d81fc95c30 # v1.0.3
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

  create-tag:
    name: Create Git Tag from VERSION
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-binaries, test, lint, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create and Push Tag
        run: |
          VERSION=$(cat VERSION | tr -d ' \n\r')
          TAG_NAME="v${VERSION}"
          echo "Checking tag ${TAG_NAME}..."
          git fetch --tags || true
          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            echo "Tag ${TAG_NAME} already exists. Skipping tag creation."
          else
            echo "Creating and pushing tag ${TAG_NAME}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
