name: Bump Version PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version number to bump (e.g., 0.10.0 or v0.10.0)'
        required: true
        type: string

permissions: {}

jobs:
  bump-version:
    name: Bump Version & Create PR
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      # Write contents to update VERSION and generated files
      contents: write
      # Create pull requests for version bump
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@v5.2.7
      - name: Regenerate Swagger & API docs
        run: |
          ./task gen:swag
      - name: Run version bump script and create PR
        run: |
          uv run python3 ./bin/bump-version.py "$VERSION" --create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
