version: '3'

includes:
  ui-gen:
    dir: ./ui
    taskfile: ./ui/GenTask.yml

tasks:
  default:
    cmds:
      - task: envrc
      - task: go-generate
      - task: swag
  clean:
    deps:
      - clean-go-generated
      - clean-tools
  envrc:
    desc: Generate .envrc from mise (environment variables are managed in mise.toml)
    cmds:
      - echo "Environment variables are managed in mise.toml"
  go-generate:
    desc: Go generate
    cmds:
      - go generate ./...
  clean-go-generated:
    cmds:
      - find . -name "*_generated.go" -type f -delete
  clean-tools:
    cmds:
      - rm -rf ./bin/tools
  swag:
    desc: Generate API
    cmds:
      - ./tools/run.sh swag init -g ./server/main.go -o ./server/docs --exclude tmp
      - task: ui-gen:swag
