version: '3'

includes:
  ui-gen:
    dir: ./ui
    taskfile: ./ui/GenTask.yml

tasks:
  default:
    cmds:
      - task: ignore-tmp
      - task: go-generate
      - task: swag
  ignore-tmp:
    desc: Ensure tmp/go.mod exists with module ignore
    cmds:
      - mkdir -p tmp
      - test -f tmp/go.mod || echo "module ignore" > tmp/go.mod
  clean:
    deps:
      - clean-go-generated
      - clean-tools
  go-generate:
    desc: Go generate
    cmds:
      - go generate ./...
  clean-go-generated:
    cmds:
      - find . -name "*_generated.go" -type f -delete
  clean-tools:
    cmds:
      - rm -rf ./bin/tools
  swag:
    desc: Generate API
    cmds:
      - ./tools/run.sh swag init -g ./server/main.go -o ./server/docs --exclude tmp
      - task: ui-gen:swag
